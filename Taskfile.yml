version: '3'

# Day-to-day commands; `task` alone lists them. CI is the gate; `task check` runs all of
# it locally, and the lint and test tasks run pieces.

# The tasks the shared/ submodule provides (shared:lint:scripts, shared:lint:md,
# shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the frontend's dependencies (run `git submodule update --init` once first)
    dir: frontend
    cmds:
      # --prefer-offline: the Font Awesome Pro kit installs from npm's cache unless the lockfile changed.
      - npm ci --prefer-offline

  dev:
    desc: Run the API on :8080 and the Vite dev server on :5173 together (open http://localhost:5173)
    deps: [dev:backend, dev:frontend]

  dev:backend:
    desc: Run the API on :8080 against devdata, with Discord webhooks held back
    # The binary embeds the SPA's build (it serves it on :8080 too), so it builds first.
    deps: [build:web]
    dir: backend
    cmds:
      # devdata is a copy of the live database, real webhook URLs included.
      - go run . -addr :8080 -db ../devdata/database.sqlite -data ../devdata/webroot -webhook-dry-run

  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev

  # CI's generated job runs the same and fails on a difference. The binary embeds the
  # front end's build, so go run needs it.
  gen:
    desc: Regenerate sqlc's queries, the API's OpenAPI document, and the SPA's types and the plugin's client from it, after a query or API change; commit the result
    deps: [build:web]
    cmds:
      - cd backend && sqlc generate
      - cd backend && go run . openapi > ../frontend/src/api/openapi.json
      - cd frontend && npx -y openapi-typescript@7.13.0 src/api/openapi.json -o src/api/schema.d.ts
      - cd frontend && npx prettier --write src/api/schema.d.ts src/api/openapi.json
      - cd plugins && dotnet tool restore && dotnet nswag run SenpanCompanion/nswag.json

  # The SPA's build, written where the Go binary embeds it (backend/internal/web/dist):
  # every Go build, test, lint and scan compiles it in, so each depends on this. Once
  # per run, so parallel steps share one build instead of emptying the folder under
  # each other, and only when its sources changed.
  build:web:
    desc: Build the frontend into backend/internal/web/dist, where the binary embeds it
    run: once
    dir: frontend
    cmds:
      - npm run build
    sources:
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/**/*
      - src/**/*
      - public/**/*
      - ../CHANGELOG.md
      - ../plugins/CHANGELOG.md
      - ../backend/CHANGELOG.md
    generates:
      - ../backend/internal/web/dist/index.html

  build:
    desc: Build the frontend and compile the backend, which embeds it
    deps: [build:web]
    cmds:
      - cd backend && go build ./...

  build:plugin:
    desc: Build the Dalamud plugin in Release against this machine's Dalamud (XIVLauncher)
    dir: plugins/SenpanCompanion
    cmds:
      - dotnet build -c Release

  test:
    desc: Run every test - the front end's (Vitest), the backend's (Go), the plugin's (xUnit) and the end-to-end suite
    aliases: [tests, test:unit, tests:unit]
    cmds:
      - task: test:frontend
      - task: test:backend
      - task: test:plugin
      - task: test:e2e

  test:frontend:
    desc: Run the frontend's Vitest tests
    aliases: [tests:frontend]
    dir: frontend
    cmds:
      - npm test

  # With coverage, so the floor in vite.config.ts fails here as in CI's frontend job.
  test:coverage:
    desc: Run the frontend's Vitest tests with coverage, failing below the floor in vite.config.ts
    dir: frontend
    cmds:
      - npm run test:coverage

  # The specs' own tsconfig.vitest.json and their type-check, as web.yml runs them.
  test:specs:
    desc: Type-check the frontend's Vitest specs, as CI does
    cmds:
      - task: shared:web:specs
        vars: { DIR: frontend }

  test:e2e:
    desc: Run the end-to-end suite (Playwright and axe) on the app as built, on a throwaway database
    aliases: [tests:e2e]
    deps: [build:web]
    dir: frontend
    cmds:
      - npm run test:e2e

  test:backend:
    desc: Run the Go tests (CI adds -race, which needs gcc here)
    aliases: [tests:backend]
    deps: [build:web]
    dir: backend
    cmds:
      - go test ./...

  # CI's backend job: coverage counted across packages (the API's request tests live in
  # internal/server and exercise internal/api), with sqlc's generated internal/db left out.
  test:go:
    desc: Run the Go tests with coverage, failing below the floor CI holds
    deps: [build:web]
    cmds:
      - task: shared:go:coverage
        vars: { DIR: backend, FLOOR: 83.5, EXCLUDE: /internal/db/, COVERPKG: ./... }

  # From the test project's folder, where plugins/global.json picks Microsoft.Testing.Platform.
  test:plugin:
    desc: Run the plugin's tests (no Dalamud needed)
    dir: plugins/SenpanCompanion.Tests
    cmds:
      - dotnet test --project SenpanCompanion.Tests.csproj

  lint:
    desc: Every lint and static check - the frontend, the backend, the plugin, the scripts, and what docs.yml checks
    cmds:
      - task: lint:frontend
      - task: lint:backend
      - task: lint:plugin
      - task: lint:scripts
      # The Markdown, the repo files and CLAUDE.md, the shared workflow refs and every
      # CHANGELOG's compare links.
      - task: shared:docs:check
        vars: { CHANGELOGS: CHANGELOG.md plugins/CHANGELOG.md backend/CHANGELOG.md }

  lint:frontend:
    dir: frontend
    cmds:
      - npm run lint:check
      - npm run format:check
      - npm run lint:conventions
      - npm run typecheck

  lint:backend:
    cmds:
      # backend/.golangci.yml is written from the shared template and .golangci.local.yml (Senpan's own rules).
      - task: shared:golangci:check
        vars: { CLI_ARGS: '-dir backend' }
      - task: lint:backend:go

  lint:backend:go:
    internal: true
    deps: [build:web]
    dir: backend
    cmds:
      - go vet ./...
      # Built from source with the pinned toolchain, the same way CI installs it.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  # The analyzers and the C# code style run in the build (plugins/Directory.Build.props),
  # so a warning fails it, as in CI; dotnet format checks the formatting of both projects.
  lint:plugin:
    desc: Build the plugin with warnings as errors and check both projects' formatting
    cmds:
      - cd plugins/SenpanCompanion && dotnet build SenpanCompanion.csproj -c Release -p:TreatWarningsAsErrors=true
      - cd plugins/SenpanCompanion && dotnet format --verify-no-changes
      - cd plugins/SenpanCompanion.Tests && dotnet format --verify-no-changes

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is untracked, so it is not linted). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  # CI's generated job: sqlc's queries, the OpenAPI document, the SPA's types and the
  # plugin's client must be what the generators make from the code. Compared with the
  # files as they were before, so a change not yet committed passes as it will in CI.
  gen:check:
    desc: Regenerate the generated code and fail if it changed any of it, as CI does
    cmds:
      - pwsh -NoProfile -File scripts/Test-GeneratedCode.ps1

  vuln:
    desc: Check dependencies for known vulnerabilities
    # govulncheck compiles the packages, the embedded SPA among them.
    deps: [build:web]
    cmds:
      # The version CI runs.
      - cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - task: shared:web:audit
        vars: { DIR: frontend }
      - task: shared:vuln

  check:
    desc: Everything CI runs - the generated code, then lint, the vulnerability checks and the tests with their coverage floors at once, then the end-to-end suite
    cmds:
      - task: gen:check
      # The steps that don't depend on each other run at once, each line prefixed with
      # its task; the end-to-end suite follows, on the same build.
      - task --parallel --output prefixed lint vuln test:coverage test:specs test:go test:plugin
      - task: test:e2e

  push:
    desc: Take the in-range updates Dependabot would open, push, and follow the commit's CI run (-- -Yes, -SkipUpdates, -NoWait)
    interactive: true
    cmds:
      - task: shared:push

  # task deploy ships everything, in order, and each part also deploys alone: the app
  # (the binary, the SPA inside it), then the plugin, only when its version is new.
  # Each ships the newest release CI tagged, and does nothing when the host runs it
  # already (-- -Force deploys it again). The SPA is in the binary, so there is no
  # deploy:frontend.
  deploy:
    desc: Deploy everything - the app, then the plugin if its version is new (pass flags after --, e.g. -- -NoDbPull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target app {{.CLI_ARGS}}
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin -IfNewer {{.CLI_ARGS}}

  deploy:backend:
    desc: Deploy the app alone (the binary, with the SPA inside), then pull the live database into devdata (-- -NoDbPull skips the pull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target app {{.CLI_ARGS}}

  deploy:plugin:
    desc: Build the Dalamud plugin from the newest release and publish it to its custom repo; refused unless its version is new
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin {{.CLI_ARGS}}
