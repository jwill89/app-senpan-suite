name: CI

# The full quality gate on every push and pull request, on shared-tooling's reusable
# workflows at the release the shared/ submodule holds (the docs job fails if the two
# ever differ): the Vue/TS frontend, the Go backend, the FFXIV plugin, the PowerShell
# scripts and the docs. `task check` runs the same checks locally.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which areas this push or pull request changed: each job below runs when its area did,
  # docs always, and every job when CI's own files, shared/ or the Taskfile change
  # (changes.yml). `task shared:ci:changes` shows what a push would run.
  changes:
    uses: jwill89/shared-tooling/.github/workflows/changes.yml@v2.19.3
    permissions:
      contents: read
      actions: read
    with:
      ignore: '**/*.md LICENSE LICENSE.* .gitignore .gitmodules .markdownlint-cli2.jsonc .vscode/** .claude/** .idea/** plans/** docs/**'
      areas: |
        app: frontend/** backend/** plugins/*/Api/** plugins/*/nswag.json plugins/dotnet-tools.json !**/*.md
        plugin: plugins/** !**/*.md

  # Lint is lint:check, which never rewrites; test:coverage fails below the floor in
  # vite.config.ts. web.yml runs the audit itself. The API types it compiles against
  # are the committed ones, which the generated job checks. The build is uploaded for
  # the backend job, since the binary embeds it.
  frontend:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).app
    uses: jwill89/shared-tooling/.github/workflows/web.yml@v2.19.3
    with:
      dir: frontend
      fontawesome: true
      scripts: lint:check format:check lint:conventions typecheck test:coverage build
      artifact-path: backend/internal/web/dist
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # The committed generated code matches what the generators produce (task gen): sqlc's
  # queries (backend/internal/db), the OpenAPI document huma renders
  # (frontend/src/api/openapi.json), the SPA's types from it (schema.d.ts), and the
  # plugin's client from it (NSwag, plugins/SenpanCompanion/Api).
  generated:
    needs: [changes, frontend]
    if: fromJSON(needs.changes.outputs.areas).app
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      # Each check runs through Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/shared/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: ${{ runner.environment == 'github-hosted' }} # a self-hosted runner keeps Go's caches itself

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The frontend job's node_modules, by the same key, so the Font Awesome kit isn't
      # fetched again; the frontend job always saves it first.
      - name: Frontend dependencies
        uses: actions/cache/restore@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/.nvmrc', 'shared/lint/web/*.js', 'shared/lint/web/*.json', 'shared/test/a11y/*.js', 'shared/test/a11y/*.json') }}
          fail-on-cache-miss: true

      # The binary embeds the front end's build, so go run needs it.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: backend/internal/web/dist

      - name: Generated code is current
        shell: pwsh
        env:
          CHECK: |
            go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
            cd backend && sqlc generate && go run . openapi > ../frontend/src/api/openapi.json && cd ..
            cd frontend && npx -y openapi-typescript@7.13.0 src/api/openapi.json -o src/api/schema.d.ts && npx prettier --write src/api/schema.d.ts src/api/openapi.json && cd ..
            cd plugins && dotnet tool restore && dotnet nswag run SenpanCompanion/nswag.json && cd ..
            git diff --exit-code -- backend/internal/db frontend/src/api plugins/SenpanCompanion/Api
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Generated code is current' -Command 'bash -eo pipefail -c "$CHECK"'

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore

  # golangci-lint with backend/.golangci.yml (written from the shared template), the
  # tests under the race detector with their coverage floor (raise it as tests land,
  # never lower it), govulncheck, and the binary built as the deploy builds it - on the
  # frontend job's build, which the binary embeds, so every Go step compiles with it.
  backend:
    needs: [changes, frontend]
    if: fromJSON(needs.changes.outputs.areas).app
    uses: jwill89/shared-tooling/.github/workflows/go.yml@v2.19.3
    with:
      dir: backend
      download-artifact: web-dist
      download-path: backend/internal/web/dist
      # Counted across packages: the API's request tests live in internal/server and
      # exercise internal/api. `task test:go` checks the same floor locally.
      coverpkg: ./...
      coverage-floor: 83.5
      # sqlc's generated code (every Go file in internal/db) is left out of the count: the
      # code that calls it is tested.
      coverage-exclude: /internal/db/
      build: go build -ldflags="-s -w" -o app-suite .

  # Built against Dalamud with warnings as errors (the shared analyzers, imported by
  # plugins/Directory.Build.props), dotnet format, and the tests of everything that
  # doesn't touch the game (the client, the live stream's reader, the pricing).
  plugin:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).plugin
    uses: jwill89/shared-tooling/.github/workflows/dotnet.yml@v2.19.3
    with:
      projects: plugins/SenpanCompanion
      test-project: plugins/SenpanCompanion.Tests
      warnings-as-errors: true

  # The end-to-end run (frontend/playwright.config.ts): the app as production runs it -
  # the binary, built with the front end's build embedded, serving the API and the SPA -
  # on a throwaway database with Discord held back (-webhook-dry-run), in the runner's
  # Chrome. Every main page must pass axe at WCAG 2.2 AA, and a player must join a
  # board, see a draw arrive live and keep a stamp across a reload.
  e2e:
    needs: [changes, frontend, backend]
    if: fromJSON(needs.changes.outputs.areas).app
    uses: jwill89/shared-tooling/.github/workflows/e2e.yml@v2.19.3
    with:
      dir: frontend
      go-version-file: backend/go.mod
      fontawesome: true
      setup: npm --prefix frontend run build
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  scripts:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).scripts
    uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v2.19.3

  # The app's, the plugin's and the backend's closed CHANGELOG, each with its compare links.
  docs:
    uses: jwill89/shared-tooling/.github/workflows/docs.yml@v2.19.3
    with:
      changelogs: CHANGELOG.md plugins/CHANGELOG.md backend/CHANGELOG.md

  # OSV-Scanner over every lockfile. An osv-scanner.toml beside a lockfile passes over the
  # advisories that reach only lint, test or build tooling.
  osv:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).lockfiles
    uses: jwill89/shared-tooling/.github/workflows/osv.yml@v2.19.3

  # On a push to main, AFTER the whole gate passes, tag + release a version with no
  # release yet: the app as v<version> (which the deploy ships) and the plugin as
  # Plugin-v<version>, each with its own CHANGELOG's entry as the body, so a green version
  # bump auto-publishes a release linked to its notes. Idempotent - versions already
  # released are skipped, so ordinary main pushes are a no-op here.
  release:
    name: Tag + release (main, on version bump)
    needs: [changes, frontend, generated, backend, e2e, plugin, scripts, docs, osv]
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release a new app or plugin version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh

  # When a job fails, one report of what failed and where: at the head of the run's page,
  # and as the ci-report artifact `task shared:ci:report` prints (report.yml).
  report:
    needs: [changes, frontend, generated, backend, plugin, e2e, scripts, docs, osv, release]
    if: failure()
    uses: jwill89/shared-tooling/.github/workflows/report.yml@v2.19.3
    permissions:
      contents: read
      actions: read
